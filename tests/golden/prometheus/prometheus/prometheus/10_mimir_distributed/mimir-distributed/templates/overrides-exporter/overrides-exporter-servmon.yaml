apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/component: overrides-exporter
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: mimir
    app.kubernetes.io/version: 3.1.2
    helm.sh/chart: mimir-distributed-6.1.0
  name: prometheus-mimir-overrides-exporter
  namespace: prometheus
spec:
  endpoints:
    - port: http-metrics
      relabelings:
        - action: replace
          replacement: prometheus/overrides-exporter
          sourceLabels:
            - job
          targetLabel: job
        - action: replace
          replacement: prometheus
          targetLabel: cluster
      scheme: http
  namespaceSelector:
    matchNames:
      - prometheus
  selector:
    matchExpressions:
      - key: prometheus.io/service-monitor
        operator: NotIn
        values:
          - 'false'
    matchLabels:
      app.kubernetes.io/component: overrides-exporter
      app.kubernetes.io/instance: prometheus
      app.kubernetes.io/name: mimir
